name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # pnpm from `packageManager` in package.json, Node from .nvmrc, pnpm store cached by lockfile hash.
      - uses: pnpm/setup@v3
        with:
          node-version-file: .nvmrc
          cache: true
          install: false

      - run: pnpm install --frozen-lockfile

      # Biome, Prettier, AGENTS.md references, types, unit tests and production build.
      - run: pnpm check

      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm test:e2e
